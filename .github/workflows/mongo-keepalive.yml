name: MongoDB keep-alive

on:
  schedule:
    - cron: "17 9 * * 1"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Ping MongoDB
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          npm install mongodb@6 --no-save --silent
          node -e '
            const { MongoClient } = require("mongodb");
            (async () => {
              const client = new MongoClient(process.env.MONGODB_URI, { serverSelectionTimeoutMS: 20000 });
              try {
                await client.connect();
                await client.db("admin").command({ ping: 1 });
                console.log("MongoDB ping OK", new Date().toISOString());
              } catch (e) {
                console.error("MongoDB ping FAILED - cluster may be paused. Resume it in Atlas.", e.message);
                process.exit(1);
              } finally {
                await client.close();
              }
            })();
          '
